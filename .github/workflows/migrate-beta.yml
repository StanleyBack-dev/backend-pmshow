name: Run Beta Database Migrations

# Mirrors the migration-first step in deploy-backend.yml, pointed at the
# beta Neon branch instead of production. Deliberately does not deploy to
# Vercel afterwards — beta already redeploys automatically via Vercel's
# native git integration on push, independent of this workflow.
on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - beta

permissions:
  contents: read

concurrency:
  group: migrate-beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: Run migrations (Beta)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate beta DB env
        env:
          DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo "Missing secret: BETA_DATABASE_URL" && exit 1)

      # NODE_ENV=production keeps the TypeORM CLI from loading any local env
      # file; the beta target is decided solely by BETA_DATABASE_URL.
      - name: Run database migrations (beta, migration-first)
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.BETA_DATABASE_URL }}
          DB_SSL: "true"
        run: npm run migration:run:prod

      # Tells the ADMIN_MASTER (app and e-mail) through the API; skipped
      # when API_URL/CRON_SECRET are not set in this repository.
      - name: Alert the administrators
        if: failure()
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then exit 0; fi
          jq -n --arg workflow "$GITHUB_WORKFLOW" --arg job "$GITHUB_JOB" \
            --arg runUrl "$RUN_URL" --arg branch "$GITHUB_REF_NAME" \
            '{workflow: $workflow, job: $job, runUrl: $runUrl, branch: $branch}' |
            curl --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" --data @- \
              "$API_URL/internal/alerts/routine-failed" || true
