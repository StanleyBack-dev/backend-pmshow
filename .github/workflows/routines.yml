name: Routines

# Scheduled calls to the API's internal routes (Vercel Hobby has no crons).
# They authenticate with CRON_SECRET; until the API is deployed and the
# secrets API_URL / CRON_SECRET exist, every run is skipped.
#   - outbox: retries notifications the best-effort delivery after each
#     change could not send (e-mail provider down, function frozen…);
#   - media: removes audio uploads requested and never confirmed.
on:
  schedule:
    # GitHub may start scheduled runs a few minutes late; that is fine here.
    - cron: "*/15 * * * *"
    - cron: "30 6 * * *" # 03:30 in Goiás
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routines
  cancel-in-progress: false

jobs:
  run:
    name: internal routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the API is deployed
        id: ready
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL/CRON_SECRET not set — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Process the outbox
        if: steps.ready.outputs.ready == 'true'
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/outbox/process"

      - name: Purge stale uploads
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/media/purge-stale-uploads"
