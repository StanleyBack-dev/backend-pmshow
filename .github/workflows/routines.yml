name: Routines

# Scheduled calls to the API's internal routes (Vercel Hobby has no crons).
# They authenticate with CRON_SECRET; until the API is deployed and the
# secrets API_URL / CRON_SECRET exist, every run is skipped.
#   - outbox: retries notifications the best-effort delivery after each
#     change could not send (e-mail provider down, function frozen…);
#   - media: removes audio uploads requested and never confirmed;
#   - rosters: morning reminders for today's and tomorrow's events;
#   - maintenance: deletes ended sessions, used codes, delivered messages and
#     other data past its retention.
on:
  schedule:
    # GitHub may start scheduled runs a few minutes late; that is fine here.
    - cron: "*/15 * * * *"
    - cron: "30 6 * * *" # 03:30 in Goiás
    - cron: "0 9 * * *" # 06:00 in Goiás
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routines
  cancel-in-progress: false

jobs:
  run:
    name: internal routes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the API is deployed
        id: ready
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "API_URL/CRON_SECRET not set — skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Process the outbox
        if: steps.ready.outputs.ready == 'true'
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/outbox/process"

      - name: Purge stale uploads
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/media/purge-stale-uploads"

      - name: Clean up old data
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '30 6 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 120 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/maintenance/cleanup"

      - name: Send event reminders
        if: steps.ready.outputs.ready == 'true' && (github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          curl --fail-with-body --silent --show-error --max-time 300 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$API_URL/internal/rosters/reminders"

      # Tells the ADMIN_MASTER (app and e-mail) through the API; skipped
      # when API_URL/CRON_SECRET are not set in this repository.
      - name: Alert the administrators
        if: failure()
        env:
          API_URL: ${{ secrets.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then exit 0; fi
          jq -n --arg workflow "$GITHUB_WORKFLOW" --arg job "$GITHUB_JOB" \
            --arg runUrl "$RUN_URL" --arg branch "$GITHUB_REF_NAME" \
            '{workflow: $workflow, job: $job, runUrl: $runUrl, branch: $branch}' |
            curl --silent --show-error --max-time 30 -X POST \
              -H "Authorization: Bearer $CRON_SECRET" \
              -H "Content-Type: application/json" --data @- \
              "$API_URL/internal/alerts/routine-failed" || true
