  enrollmentInstruments(formToken: String!): [EnrollmentInstrument!]!
  enrollmentInvites: [EnrollmentInvite!]!
  enrollmentRequests(filter: EnrollmentRequestFilterInput, page: PageInput): EnrollmentRequestPage!

  """Cadastros aguardando aprovação."""
  pendingEnrollmentCount: Int!
  enrollmentRequest(id: ID!): EnrollmentRequest!

  """Eventos por período (ordenados pelo início, até 500)."""
  events(filter: EventFilterInput): [Event!]!

  """Página de eventos: busca, tipo, situação e período."""
  eventsPage(filter: EventPageFilterInput, page: PageInput): EventPage!

  """Próximos eventos planejados ou confirmados (sem os expedientes)."""
  upcomingEvents(limit: Int! = 5): [Event!]!
  event(id: ID!): Event!

  """Página de locais, com busca."""
  venuesPage(filter: VenueFilterInput, page: PageInput): VenuePage!

  """Endereço de um CEP (ViaCEP); null se não existir."""
  zipCodeAddress(zipCode: String!): ZipCodeAddress
  venues(includeArchived: Boolean! = false): [Venue!]!
  me: SessionUser!
  users(filter: UserFilterInput, page: PageInput): UserAccountPage!
  user(id: ID!): UserAccount!
  userPermissions(id: ID!): PermissionMatrix!

  """Busca vídeos no YouTube para o cadastro de música."""
  searchYoutube(query: String!): [YoutubeSearchResult!]!

  """Link temporário para tocar o áudio (válido por pelo menos 1 hora)."""
  audioPlaybackUrl(assetId: ID!): String!

  """Link temporário que baixa o arquivo de áudio."""
  audioDownloadUrl(assetId: ID!): String!

  """Todos os usuários com acesso e o cadastro de cada um na banda."""
  roster(filter: RosterFilterInput, page: PageInput): RosterPage!
  memberProfile(userId: ID!): MemberProfile

  """O cadastro do próprio usuário na banda."""
  myMemberProfile: MemberProfile
  instruments(includeArchived: Boolean! = false): [Instrument!]!

  """Página do catálogo de instrumentos: busca, naipe, arquivados."""
  instrumentsPage(filter: InstrumentFilterInput, page: PageInput): InstrumentPage!

  """Mais recentes primeiro."""
  myNotifications(unreadOnly: Boolean! = false, page: PageInput): NotificationPage!
  unreadNotificationsCount: Int!
  myNotificationPreferences: [NotificationPreference!]!

  """Chave VAPID para o navegador assinar o push (null = desligado)."""
  pushPublicKey: String
  songs(filter: SongFilterInput, page: PageInput): SongPage!
  song(id: ID!): Song!

  """Tags em uso no repertório."""
  songTags: [String!]!

  """Títulos, para o filtro."""
  songTitles(archived: Boolean! = false): [String!]!

  """Letra completa num catálogo (null = não encontrada)."""
  findLyrics(artist: String!, title: String!): LyricsResult

  """
  Escala do evento. Rascunhos só para quem vê todas; publicada para todos (sem contatos para quem não é gestor).
  """
  eventRoster(eventId: ID!): Roster

  """Integrantes com o que bloqueia ou alerta para este evento."""
  rosterCandidates(eventId: ID!): [RosterCandidate!]!

  """Minhas escalas publicadas, dos próximos eventos."""
  myAssignments(
    """true: só cientes; false: as que faltam ciência; vazio: todas."""
    acknowledged: Boolean
  ): [MyAssignment!]!

  """Minhas escalas publicadas de uma aba, por página."""
  myAssignmentsPage(tab: MyAssignmentTab!, page: PageInput): MyAssignmentPage!

  """Quantas das minhas escalas há em cada aba."""
  myAssignmentCounts: MyAssignmentCounts!

  """
  Pedidos de troca em aberto nas escalas publicadas dos próximos eventos.
  """
  swapRequests(page: PageInput): MyAssignmentPage!

  """Quantas solicitações de suporte ainda posso enviar hoje."""
  supportQuota: SupportQuota!

  """Minhas solicitações de suporte, das mais recentes."""
  mySupportRequests(page: PageInput): SupportRequestPage!

  """Todas as solicitações de suporte (administração)."""
  supportRequests(status: SupportStatus, page: PageInput): SupportRequestPage!
}

input ArtistFilterInput {
  """Parte do nome (sem acento)."""
