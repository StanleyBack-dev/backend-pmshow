"""Aba de Minhas escalas."""
enum MyAssignmentTab {
  """Eventos aguardando ciência (ou com troca pedida)."""
  PENDING

  """Eventos com ciência confirmada."""
  ACKNOWLEDGED

  """Dias de expediente (sem ciência)."""
  DUTY
}

type Mutation {
  createArtist(input: ArtistInput!): Artist!
  updateArtist(id: ID!, input: ArtistInput!): Artist!

  """Pede para si (pendente)."""
  requestAbsence(input: AbsenceInput!): Absence!

  """Formulários para enviar os anexos do pedido direto ao armazenamento."""
  requestAbsenceAttachmentUploads(files: [AttachmentFileInput!]!): [AbsenceAttachmentUpload!]!

  """Lança para alguém, já aprovada."""
  registerAbsence(userId: ID!, input: AbsenceInput!): Absence!
  reviewAbsence(id: ID!, approve: Boolean!, note: String): Absence!
  cancelAbsence(id: ID!): Absence!
  createBandFunction(input: CreateBandFunctionInput!): BandFunction!
  updateBandFunction(id: ID!, input: UpdateBandFunctionInput!): BandFunction!
  sendBroadcast(input: BroadcastInput!): Broadcast!

  """
  Lança o expediente: um evento por dia, com a escala publicada; avisa cada pessoa uma vez.
  """
  createDutySchedule(input: DutyScheduleInput!): DutySchedule!

  """Cancela os dias que ainda não aconteceram e avisa uma vez."""
  cancelDutySchedule(id: ID!, input: CancelDutyScheduleInput!): DutySchedule!

  """
  Confere o código da turma e devolve o token do formulário (vale 60 min).
  """
  verifyEnrollmentCode(code: String!): String!

  """Envia o cadastro, que aguarda a aprovação da administração."""
  submitEnrollment(input: SubmitEnrollmentInput!): Boolean!
  createEnrollmentInvite(input: CreateEnrollmentInviteInput!): EnrollmentInvite!
  revokeEnrollmentInvite(id: ID!): EnrollmentInvite!

  """
  Aprova o cadastro (com as correções): cria o usuário e o perfil de músico.
  """
  approveEnrollmentRequest(id: ID!, data: EnrollmentDataInput!, group: UserGroup!): EnrollmentApproval!
  rejectEnrollmentRequest(id: ID!, reason: String!): EnrollmentRequest!
  createEvent(input: EventInput!): Event!
  updateEvent(id: ID!, input: EventInput!): Event!

  """Confirma, cancela (com motivo), reabre ou marca como realizado."""
  changeEventStatus(id: ID!, status: EventStatus!, reason: String): Event!

  """Substitui a lista de músicas do evento, na ordem dada."""
  setEventSetlist(id: ID!, input: SetlistInput!): [SetlistEntry!]!
  createVenue(input: VenueInput!): Venue!
  updateVenue(id: ID!, input: VenueInput!): Venue!

  """Entra com usuário (ou e-mail) e senha."""
  login(input: LoginInput!): LoginResult!

  """Novo access token a partir do refresh token da sessão."""
  refreshSessionTokens(refreshToken: String!): AuthTokens!

  """Encerra a sessão atual."""
  logout: Boolean!

  """
  Troca a própria senha (inclusive a temporária). Encerra as outras sessões.
  """
  changeMyPassword(input: ChangePasswordInput!): Boolean!
  updateMyProfile(input: UpdateMyProfileInput!): SessionUser!

  """
  Envia um código por e-mail. Sempre responde true, exista ou não o usuário.
  """
  requestPasswordRecovery(login: String!): Boolean!

  """Confere o código e devolve o token para redefinir a senha."""
  verifyPasswordRecoveryCode(input: VerifyRecoveryCodeInput!): String!
  resetPasswordWithRecovery(input: ResetPasswordInput!): Boolean!

  """Marca a apresentação guiada como vista (concluída ou pulada)."""
  completeOnboarding: Boolean!

  """Cria o usuário com senha temporária (enviada por e-mail)."""
  createUser(input: CreateUserInput!): TemporaryAccess!
  updateUser(id: ID!, input: UpdateUserInput!): UserAccount!

  """Ativa ou desativa o acesso. Desativar encerra as sessões."""
  setUserActive(id: ID!, active: Boolean!): UserAccount!

  """Gera nova senha temporária e encerra as sessões do usuário."""
  resetUserPassword(id: ID!): TemporaryAccess!
  unlockUser(id: ID!): UserAccount!
  revokeUserSessions(id: ID!): UserAccount!
  setUserPermissions(input: SetUserPermissionsInput!): PermissionMatrix!
  addYoutubeVideo(input: AddYoutubeVideoInput!): MediaAsset!

  """
  1º passo do envio de áudio: devolve o formulário assinado para o navegador enviar o arquivo direto ao armazenamento.
  """
  requestAudioUpload(input: RequestAudioUploadInput!): AudioUploadTicket!

  """2º passo: confere o arquivo no armazenamento e o publica."""
  confirmAudioUpload(input: ConfirmAudioUploadInput!): MediaAsset!
  renameMedia(id: ID!, title: String!): MediaAsset!
  removeMedia(id: ID!): Boolean!

  """Cria ou atualiza o cadastro do integrante."""
  saveMemberProfile(userId: ID!, input: MemberProfileInput!): MemberProfile!
  createInstrument(input: CreateInstrumentInput!): Instrument!
  updateInstrument(id: ID!, input: UpdateInstrumentInput!): Instrument!
  markNotificationRead(id: ID!): Boolean!

  """Quantas foram marcadas."""
  markAllNotificationsRead: Int!
  setNotificationPreference(type: NotificationType!, emailEnabled: Boolean!): NotificationPreference!

  """Ativa o push neste aparelho."""
  subscribePush(input: PushSubscriptionInput!): Boolean!

  """Desativa o push neste aparelho."""
  unsubscribePush(endpoint: String!): Boolean!

  """Envia um push de teste; devolve quantos aparelhos receberam."""
  sendTestPush: Int!

  """
  Troca a própria foto de perfil (base64, já reduzida pelo navegador). Devolve o link temporário.
  """
  setMyPhoto(photo: String!): String!

  """Remove a própria foto de perfil."""
  removeMyPhoto: Boolean!
  createSong(input: SongInput!): Song!
  updateSong(id: ID!, input: SongInput!): Song!

  """Arquiva (some das listas) ou restaura a música."""
  setSongArchived(id: ID!, archived: Boolean!): Song!

  """
  Substitui a lista da escala. Publicada: notifica só quem entrou, saiu ou mudou de função.
  """
  saveRoster(eventId: ID!, input: RosterInput!): Roster!

  """
  Não aceita o pedido de troca: a pessoa continua na escala e volta a dar ciência (é avisada).
  """
  keepOnRoster(eventId: ID!, userId: ID!, note: String): Assignment!

  """Publica e notifica todos."""
  publishRoster(eventId: ID!): Roster!

  """Ciente, ou pedido de troca (com motivo)."""
  acknowledgeRoster(eventId: ID!, answer: AckAnswer!, note: String): Assignment!

  """
  Envia uma solicitação de suporte (até 3 por dia); avisa os administradores.
  """
  sendSupportRequest(input: SupportRequestInput!): SupportRequest!

  """Responde a solicitação; quem pediu é avisado."""
  replySupportRequest(id: ID!, reply: String!): SupportRequest!

  """Finaliza a solicitação; quem pediu é avisado."""
  finalizeSupportRequest(id: ID!): SupportRequest!
}

